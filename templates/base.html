<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroTime AI</title>
    <!-- Tailwind CSS (for Step 8: Responsive Layouts) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet.js CSS (for Step 6: Interactive Map) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Step 7: Responsive Navigation Bar -->
    <nav class="bg-slate-950 border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <span class="text-xl font-bold tracking-wider text-blue-400">AstroTime AI</span>
                </div>
                <!-- Desktop Menu -->
                <div class="hidden md:block">
                    <div class="ml-10 flex items-baseline space-x-4">
                        <a href="/" class="hover:text-blue-400 px-3 py-2 rounded-md text-sm font-medium">Home</a>
                        <a href="/analysis" class="hover:text-blue-400 px-3 py-2 rounded-md text-sm font-medium">Analysis</a>
                        <a href="/learn" class="hover:text-blue-400 px-3 py-2 rounded-md text-sm font-medium">Learn</a>
                        <a href="/ai-assistant" class="hover:text-blue-400 px-3 py-2 rounded-md text-sm font-medium">AI Assistant</a>
                        <a href="/about" class="hover:text-blue-400 px-3 py-2 rounded-md text-sm font-medium">About</a>
                    </div>
                </div>
                <!-- Mobile Menu Button (Step 8) -->
                <div class="md:hidden">
                    <button onclick="toggleMobileMenu()" class="text-slate-400 hover:text-white focus:outline-none">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        <!-- Mobile Dropdown Menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-slate-950 border-b border-slate-800 px-2 pt-2 pb-3 space-y-1">
            <a href="/" class="block hover:bg-slate-800 text-white px-3 py-2 rounded-md text-base font-medium">Home</a>
            <a href="/analysis" class="block hover:bg-slate-800 text-white px-3 py-2 rounded-md text-base font-medium">Analysis</a>
            <a href="/learn" class="block hover:bg-slate-800 text-white px-3 py-2 rounded-md text-base font-medium">Learn</a>
            <a href="/ai-assistant" class="block hover:bg-slate-800 text-white px-3 py-2 rounded-md text-base font-medium">AI Assistant</a>
            <a href="/about" class="block hover:bg-slate-800 text-white px-3 py-2 rounded-md text-base font-medium">About</a>
        </div>
    </nav>

    <!-- Main Dynamic Content Block -->
    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    <!-- Global Footer -->
    <footer class="bg-slate-950 text-center py-6 border-t border-slate-800 text-xs text-slate-500">
        <p>&copy; 2026 AstroTime AI. Politeknik Malaysia Project. Created by Tamilkumaran & Muhammad Nafiz Najmi.</p>
    </footer>

    <script>
        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
        }
    </script>
</body>
</html>
