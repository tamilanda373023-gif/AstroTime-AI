{% extends "base.html" %}
{% block title %}Forgot Password - AstroTime AI{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12">
    <div class="glass-card rounded-2xl p-8 shadow-2xl border border-slate-800">
        <h2 class="text-2xl font-bold text-blue-400 text-center mb-2">Forgot Password</h2>
        <p class="text-xs text-slate-400 text-center mb-6">
            Enter your registered email address to request a reset link.
        </p>

        <form method="POST" action="/forgot-password" class="space-y-4">
            <div>
                <label class="block text-xs text-slate-400 mb-1">Email Address</label>
                <input type="email" name="email" required placeholder="user@example.com"
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white focus:border-blue-500 focus:outline-none">
            </div>

            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-lg transition text-xs shadow-lg">
                Send Reset Link
            </button>
        </form>

        <div class="mt-4 text-center">
            <a href="/login" class="text-xs text-slate-400 hover:text-white transition">← Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
