{% extends 'base.html' %}
{% block content %}
<div class="max-w-4xl mx-auto px-4 py-10">
    <div class="bg-slate-950 p-6 rounded-xl border border-slate-800 shadow-2xl">
        <h1 class="text-2xl font-extrabold text-white mb-4">AI Astronomical Co-Pilot</h1>
        
        <div id="chat-box" class="h-80 overflow-y-auto bg-slate-900 border border-slate-800 rounded-lg p-4 space-y-4 mb-4 text-sm">
            <div class="bg-slate-800/60 p-3 rounded-lg text-slate-300">
                <strong class="text-blue-400 block mb-1">AstroTime Bot:</strong>
                Hello! Ask me any questions regarding how Mean Solar Time, Apparent Solar Time, and Sidereal Time correlate within practical field surveying workflows.
            </div>
        </div>

        <form id="chat-form" class="flex gap-2">
            <input type="text" id="chat-input" placeholder="Type your question here..." required
                class="flex-1 bg-slate-900 border border-slate-800 focus:border-blue-500 text-white rounded-lg px-4 py-2.5 outline-none text-sm">
            <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-6 py-2.5 rounded-lg transition-all text-sm">
                Send
            </button>
        </form>
    </div>
</div>

<script>
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    const chatBox = document.getElementById('chat-box');

    chatForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const message = chatInput.value.trim();
        if (!message) return;

        chatBox.innerHTML += `
            <div class="bg-blue-950/40 border border-blue-800/40 p-3 rounded-lg text-slate-200">
                <strong class="text-blue-300 block mb-1">You:</strong>
                ${message}
            </div>
        `;
        chatInput.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: message })
        })
        .then(res => res.json())
        .then(data => {
            chatBox.innerHTML += `
                <div class="bg-slate-800/60 p-3 rounded-lg text-slate-300">
                    <strong class="text-blue-400 block mb-1">AstroTime Bot:</strong>
                    ${data.response}
                </div>
            `;
            chatBox.scrollTop = chatBox.scrollHeight;
        })
        .catch(err => {
            chatBox.innerHTML += `
                <div class="bg-red-950/40 border border-red-800/40 p-3 rounded-lg text-red-300">
                    <strong class="text-red-400 block mb-1">System Error:</strong>
                    Could not reach the AI Assistant backend.
                </div>
            `;
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    });
</script>
{% endblock %}
