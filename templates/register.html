<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8"><title>Register - AstroTime AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-900/90 border border-slate-800 p-8 rounded-2xl w-full max-w-md space-y-6 backdrop-blur-xl">
        <div class="text-center space-y-1">
            <h1 class="text-2xl font-extrabold text-blue-500">AstroTime<span class="text-white">AI</span></h1>
            <p class="text-xs text-slate-400">Create a Geomatics workspace account</p>
        </div>
        {% with msgs = get_flashed_messages(with_categories=true) %}
          {% if msgs %}
            {% for cat, msg in msgs %}
              <div class="bg-red-950/60 border border-red-500/40 text-red-300 p-2.5 rounded-lg text-xs">{{ msg }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <form method="POST" action="/register" class="space-y-4 text-xs font-mono">
            <div>
                <label class="block text-slate-400 mb-1">Username</label>
                <input type="text" name="username" required class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-slate-400 mb-1">Email Address</label>
                <input type="email" name="email" required class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-slate-400 mb-1">Password</label>
                <input type="password" name="password" required class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 font-sans font-bold text-sm py-2.5 rounded-lg transition">Create Account</button>
        </form>
        <div class="text-center text-xs text-slate-500">
            Already registered? <a href="/login" class="text-blue-400 hover:underline">Sign In</a> | <a href="/" class="text-slate-400 hover:underline">Home</a>
        </div>
    </div>
</body>
</html>
