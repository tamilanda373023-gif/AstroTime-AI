{% extends "base.html" %}
{% block title %}Create New Password - AstroTime AI{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12">
    <div class="glass-card rounded-2xl p-8 shadow-2xl border border-slate-800">
        <h2 class="text-2xl font-bold text-emerald-400 text-center mb-2">Create New Password</h2>
        <p class="text-xs text-slate-400 text-center mb-6">
            Please enter your new password below.
        </p>

        <form method="POST" action="/reset-password/{{ token }}" class="space-y-4">
            <div>
                <label class="block text-xs text-slate-400 mb-1">New Password</label>
                <input type="password" name="password" required placeholder="••••••••"
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white focus:border-blue-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-xs text-slate-400 mb-1">Confirm New Password</label>
                <input type="password" name="confirm_password" required placeholder="••••••••"
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white focus:border-blue-500 focus:outline-none">
            </div>

            <button type="submit"
                class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-lg transition text-xs shadow-lg">
                Update Password
            </button>
        </form>
    </div>
</div>
{% endblock %}
